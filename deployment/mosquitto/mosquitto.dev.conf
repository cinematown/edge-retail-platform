# Development-only Mosquitto configuration.
# The password file is generated from .env by docker-compose.dev.yml.

listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/auth/password_file

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
